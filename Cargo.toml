[workspace]
resolver = "2"
members = [
    "crates/fuu-model",
    "crates/fuu-parser",
    "crates/fuu-sanitiser",
    "crates/fuu-core",
    "crates/fuu-render",
    "crates/fuu-editor",
    "crates/fuu-preview",
    "crates/fuu-app",
    "crates/fuu-i18n",
]
# Needs nightly (cargo-fuzz); see fuzz/Cargo.toml.
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0-alpha.4"
edition = "2021"
license = "GPL-3.0-only"
rust-version = "1.95"
publish = false

[workspace.dependencies]
fuu-model = { path = "crates/fuu-model" }
fuu-parser = { path = "crates/fuu-parser" }
fuu-sanitiser = { path = "crates/fuu-sanitiser" }
fuu-core = { path = "crates/fuu-core" }
fuu-render = { path = "crates/fuu-render" }
fuu-editor = { path = "crates/fuu-editor" }
fuu-preview = { path = "crates/fuu-preview" }
fuu-i18n = { path = "crates/fuu-i18n" }

# Heavy pixel work stays usable in debug builds and tests (PDF previews).
[profile.dev.package.hayro]
opt-level = 2
[profile.dev.package.hayro-interpret]
opt-level = 2
[profile.dev.package.hayro-syntax]
opt-level = 2
[profile.dev.package.hayro-font]
opt-level = 2
[profile.dev.package.hayro-cmap]
opt-level = 2
[profile.dev.package.hayro-postscript]
opt-level = 2
[profile.dev.package.hayro-ccitt]
opt-level = 2
[profile.dev.package.hayro-jbig2]
opt-level = 2
[profile.dev.package.hayro-jpeg2000]
opt-level = 2
[profile.dev.package.vello_cpu]
opt-level = 2
[profile.dev.package.vello_common]
opt-level = 2
[profile.dev.package.fearless_simd]
opt-level = 2
[profile.dev.package.kurbo]
opt-level = 2
[profile.dev.package.peniko]
opt-level = 2
[profile.dev.package.pic-scale]
opt-level = 2
[profile.dev.package.skrifa]
opt-level = 2
[profile.dev.package.read-fonts]
opt-level = 2
[profile.dev.package.font-types]
opt-level = 2
[profile.dev.package.image]
opt-level = 2
[profile.dev.package.png]
opt-level = 2
[profile.dev.package.zune-jpeg]
opt-level = 2
[profile.dev.package.zune-core]
opt-level = 2
