[package]
name = "fuu-app"
description = "Fuu desktop mailer: Slint UI and engine wiring."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "fuu"
path = "src/main.rs"

[features]
default = []
# Opt-in Skia renderer for the M0 CJK comparison (pulls prebuilt skia binaries).
skia = ["slint/renderer-skia"]

[dependencies]
fuu-model.workspace = true
fuu-render.workspace = true
fuu-sanitiser.workspace = true
fuu-core.workspace = true
fuu-parser.workspace = true
fuu-editor.workspace = true
fuu-preview.workspace = true
rfd = { version = "0.15", default-features = false, features = ["xdg-portal"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
slint = { version = "1.19", features = ["raw-window-handle-06", "unstable-winit-030"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros"] }
open = "5"
arboard = { version = "3.7", default-features = false }
png = "0.18"

[dev-dependencies]
# examples/make_icons.rs (same version Slint already builds).
resvg = "0.49"

[build-dependencies]
slint-build = "1.19"

[target.'cfg(windows)'.build-dependencies]
# Embeds icons/app/fuu.ico in fuu.exe (Explorer, taskbar, shortcuts).
winresource = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
# A unified (empty) toolbar centres the native traffic lights in the title bar.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSToolbar", "NSWindow", "NSView", "NSResponder", "NSButton", "NSControl"] }
# mailto: URLs arrive as Apple Events; the bundle id names the default handler.
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSAppleEventManager", "NSAppleEventDescriptor", "NSBundle", "NSString", "NSObject", "objc2-core-services"] }

[target.'cfg(windows)'.dependencies]
# Single instance (named pipe) and registering as a mail app (HKCU).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

# Installers and app bundles: `cargo packager --release` (see README). The
# packaging tools (NSIS, …) are fetched at pinned versions and verified by hash,
# so packages build the same on every machine.
[package.metadata.packager]
productName = "Fuu"
identifier = "dev.fuu.Fuu"
publisher = "Fuu"
copyright = "GPL-3.0-only"
description = "A minimal mail client"
category = "Productivity"
licenseFile = "../../LICENSE"
beforePackagingCommand = "cargo build -p fuu-app --release --locked"
outDir = "../../dist"
binaries = [{ path = "fuu", main = true }]
# Regenerate with `cargo run -p fuu-app --example make_icons`.
icons = ["icons/app/fuu.icns", "icons/app/fuu.ico", "icons/app/fuu-32.png", "icons/app/fuu-128.png", "icons/app/fuu-256.png"]
resources = ["../../README.md", "../../LICENSE"]

[package.metadata.packager.nsis]
# Per user, no administrator rights (%LOCALAPPDATA%\Fuu).
installMode = "currentUser"
# setup.exe's own icon (the `icons` list only reaches the installed app).
installerIcon = "icons/app/fuu.ico"
languages = ["Japanese", "English"]

[package.metadata.packager.macos]
minimumSystemVersion = "11.0"
# Declares the mailto: scheme (merged into the generated Info.plist).
infoPlistPath = "packaging/macos-Info.plist"
