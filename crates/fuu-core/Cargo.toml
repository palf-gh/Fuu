[package]
name = "fuu-core"
description = "Accounts, IMAP/SMTP, OAuth, cache and compose logic. UI independent."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
# Allows unencrypted IMAP for the local integration-test server only. Never enable
# in a shipped build: production code paths always require TLS.
insecure-test-transport = []

[dependencies]
fuu-model.workspace = true
fuu-parser.workspace = true
fuu-sanitiser.workspace = true
serde = { version = "1", features = ["derive"] }
toml = "1"
dirs = "7"
keyring = "4"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util"] }
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
futures = "0.3"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-platform-verifier = "0.7"
webpki-roots = "1"
rusqlite = { version = "0.43", features = ["bundled"] }
utf7-imap = "0.3"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

[dev-dependencies]
tempfile = "3"
