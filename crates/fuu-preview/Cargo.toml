[package]
name = "fuu-preview"
description = "Attachment previews: images, PDF and Office files to neutral HTML with inline images. Knows nothing about UI; the sanitiser always runs on its output."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
fuu-i18n.workspace = true
fuu-model.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
hayro = "0.9"
zip = { version = "9", default-features = false, features = ["deflate"] }
quick-xml = "0.41"
calamine = { version = "0.38", features = ["dates"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }

[dev-dependencies]
fuu-sanitiser.workspace = true
